<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .tile { fill: #ebe9e4; }
    .halo { fill: #1d3f8f; opacity: 0.12; }
    .dot { fill: #1d3f8f; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #0f1118; }
      .halo { fill: #6b98e0; opacity: 0.28; }
      .dot { fill: #6b98e0; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
  </defs>
  <rect class="tile" width="64" height="64" rx="14" />
  <circle class="halo" cx="32" cy="32" r="20" filter="url(#glow)" />
  <circle class="dot" cx="32" cy="32" r="13" />
</svg>
